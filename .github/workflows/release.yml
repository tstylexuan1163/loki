# Builds loki for macOS (Apple silicon and Intel) and Windows, and attaches
# the installers to a GitHub Release. Runs when a `v*` tag is pushed, or by
# hand from the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.7.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # One draft release up front, so the parallel builds upload to the same
  # place instead of racing to create it.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || notes=/dev/null
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "loki ${TAG}" --notes-file "$notes" --verify-tag
          fi

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib --target ${{ matrix.target }}
        # Cross-arch test binaries cannot run on the arm64 runner.
        if: matrix.target != 'x86_64-apple-darwin'

      # Looked up by tag rather than by id: a freshly created draft does not
      # show up in the releases listing right away, and an empty id makes the
      # action skip every upload without failing.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: loki ${{ env.TAG }}
          releaseDraft: true
          args: ${{ matrix.args }}

  # Publish only once every platform's installer is attached.
  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "assets: $count"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected installers for every platform, found $count assets"
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
