[package]
name = "loki"
version = "0.10.1"
description = "loki — an SSH client with an AI assistant beside every terminal"
authors = ["loki contributors"]
edition = "2021"
rust-version = "1.82"
license = "MIT"

[lib]
name = "loki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process"] }
# SSH: pure-Rust client, same family Hatoba uses.
russh = { version = "0.54", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3"
# Serial console: switches, routers, and embedded boards.
serialport = "4"
# Local timestamps for recording headers. Already in the tree via tauri.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# In-app update check and install. Rust-only: the JS binding is not used, so the
# npm package is not required.
tauri-plugin-updater = "2"
# Local shell tabs.
portable-pty = "0.9"
# Crypto for the vault: Argon2id KDF + AES-256-GCM envelope, same primitives as the blueprint.
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["zeroize_derive"] }
base64 = "0.22"
# Local store: SQLite, ciphertext only.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
# Model provider and search HTTP. rustls keeps it off OpenSSL entirely.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
